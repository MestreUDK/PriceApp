{% extends 'base.html' %}

{% block content %}
    <h2>Gerenciar Produtos</h2>

    <form method="POST">
        <h3>Adicionar Novo Produto</h3>
        <input type="text" name="nome" placeholder="Nome do Produto (Ex: Arroz 5kg)" required>
        <input type="text" name="marca" placeholder="Marca (Ex: Tio João)">
        <button type="submit">Adicionar Produto</button>
    </form>

    <hr>

    <h2>Produtos Cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Marca</th>
                <th>Ações</th> <!-- Coluna Adicionada -->
            </tr>
        </thead>
        <tbody>
            {% for produto in produtos %}
            <tr>
                <td>{{ produto.nome }}</td>
                <td>{{ produto.marca }}</td>
                <td>
                    <!-- Link Adicionado -->
                    <a href="{{ url_for('comparar_produto', produto_id=produto.id) }}" style="text-decoration: none; padding: 0.5rem 1rem; background-color: #28a745; color: white; border-radius: 4px; font-size: 0.9em;">
                        Ver Preços
                    </a>
                </td>
            </tr>
            {% else %}
            <tr>
                <!-- Colspan atualizado para 3 -->
                <td colspan="3">Nenhum produto cadastrado ainda.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
