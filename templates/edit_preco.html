{% extends 'base.html' %}

{% block content %}
    <a href="{{ url_for('prices.ver_historico', produto_id=preco.produto_id, supermercado_id=preco.supermercado_id, marca_str=preco.marca.nome if preco.marca else 'sem-marca') }}" style="color: var(--primary); text-decoration: none; margin-bottom: 1rem; display: inline-block;">
        &larr; Voltar para Histórico
    </a>
    <h2>Editando Registro de Preço</h2>

    <div class="card-form">
        <form method="POST">
            <label for="produto">1. Produto:</label>
            <input type="text" id="produto_filtro" placeholder="Filtrar...">
            <select name="produto" id="produto" required>
                {% for produto in produtos %}
                    <option value="{{ produto.id }}" {% if produto.id == preco.produto_id %}selected{% endif %}>
                        {{ produto.nome }}
                    </option>
                {% endfor %}
            </select>

            <label for="marca">2. Marca:</label>
            <input type="text" id="marca_filtro" placeholder="Filtrar...">
            <select name="marca" id="marca">
                <option value="">-- Sem marca --</option>
                {% for marca in marcas %}
                     <option value="{{ marca.id }}" {% if marca.id == preco.marca_id %}selected{% endif %}>
                        {{ marca.nome }}
                     </option>
                {% endfor %}
            </select>

            <label for="supermercado">3. Supermercado:</label>
            <input type="text" id="supermercado_filtro" placeholder="Filtrar...">
            <select name="supermercado" id="supermercado" required>
                {% for mercado in supermercados %}
                    <option value="{{ mercado.id }}" {% if mercado.id == preco.supermercado_id %}selected{% endif %}>
                        {{ mercado.nome }}
                    </option>
                {% endfor %}
            </select>

            <label for="data_cadastro">Data do Registro:</label>
            <input type="datetime-local" name="data_cadastro" value="{{ preco.data_cadastro.strftime('%Y-%m-%dT%H:%M') }}" required>

            <label for="valor">4. Preço Base (R$):</label>
            <input type="number" step="0.01" name="valor" value="{{ preco.valor }}" required>

            <div style="margin: 1rem 0; padding: 10px 15px; border: 1px dashed var(--border-color); border-radius: 4px;">
                <div style="display: flex; align-items: center; margin-bottom: 10px;">
                    <input type="checkbox" name="e_promocao" id="e_promocao" style="width: auto; margin-right: 10px;" {% if preco.e_promocao %}checked{% endif %}>
                    <label for="e_promocao" style="display: inline;">Promoção?</label>
                </div>

                <label for="data_expiracao">Expira em:</label>
                <input type="date" name="data_expiracao" value="{{ preco.data_expiracao.strftime('%Y-%m-%d') if preco.data_expiracao else '' }}">

                <div id="promo_fields" style="display: {{ 'block' if preco.e_promocao else 'none' }}; margin-top: 1rem;">
                     <label>Tipo:</label>
                     <div style="margin-bottom: 5px;"><input type="radio" name="promo_tipo" value="unidade" {% if preco.promo_tipo == 'unidade' %}checked{% endif %} style="width: auto;"> Unidade</div>
                     <div style="margin-bottom: 5px;"><input type="radio" name="promo_tipo" value="quantidade" {% if preco.promo_tipo == 'quantidade' %}checked{% endif %} style="width: auto;"> Quantidade</div>
                     <div style="margin-bottom: 5px;"><input type="radio" name="promo_tipo" value="limite" {% if preco.promo_tipo == 'limite' %}checked{% endif %} style="width: auto;"> Limite</div>

                    <div id="div_promo_unidade_valor"><label>Novo Preço:</label><input type="number" step="0.01" name="promo_unidade_valor" value="{{ preco.promo_unidade_valor or '' }}"></div>
                    <div id="div_promo_qtd_necessaria"><label>Qtd:</label><input type="number" name="promo_qtd_necessaria" value="{{ preco.promo_qtd_necessaria or '' }}"></div>
                    <div id="div_promo_qtd_valor"><label>Total:</label><input type="number" step="0.01" name="promo_qtd_valor" value="{{ preco.promo_qtd_valor or '' }}"></div>
                </div>
            </div>

            <button type="submit">Salvar Alterações</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setupSelectFilter('produto_filtro', 'produto');
            setupSelectFilter('marca_filtro', 'marca');
            setupSelectFilter('supermercado_filtro', 'supermercado');
             // Dispara evento para ajustar campos da promo
             const promoCheckbox = document.getElementById('e_promocao');
             if(promoCheckbox) promoCheckbox.dispatchEvent(new Event('change'));
        });
    </script>
{% endblock %}
