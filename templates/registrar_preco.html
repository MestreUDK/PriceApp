{% extends 'base.html' %}

{% block content %}
    <h2>Registrar Novo Preço</h2>

    <form method="POST">
        <label for="produto">1.
 Produto:</label>
        <input type="text" id="produto_filtro" placeholder="Filtrar produto..." style="margin-bottom: 0.5rem; background-color: #f8f9fa;">
        <select name="produto" id="produto" required>
        <option value="" disabled selected>-- Selecione um produto --</option>
            {% for produto in produtos %}
                <option value="{{ produto.id }}">{{ produto.nome }}</option>
            {% endfor %}
      
   </select>

        <label for="marca">2.
 Marca (Opcional):</label>
        <input type="text" id="marca_filtro" placeholder="Filtrar marca..." style="margin-bottom: 0.5rem; background-color: #f8f9fa;">
        <select name="marca" id="marca">
        <option value="">-- Sem marca --</option>
            {% for marca in marcas %}
                <option value="{{ marca.id }}">{{ marca.nome }}</option>
            {% endfor %}
        </select>
 
        
        <label for="supermercado">3.
 Supermercado:</label>
        <input type="text" id="supermercado_filtro" placeholder="Filtrar supermercado..." style="margin-bottom: 0.5rem; background-color: #f8f9fa;">
        <select name="supermercado" id="supermercado" required>
        <option value="" disabled selected>-- Selecione um supermercado --</option>
            {% for mercado in supermercados %}
                <option value="{{ mercado.id }}">{{ mercado.nome }}</option>
            {% endfor %}
      
   </select>

        <label for="valor">4.
 Preço Base (R$):</label>
        <input type="number" step="0.01" name="valor" id="valor" placeholder="Ex: 5.99 (preço normal)" required>

        <div style="margin: 1rem 0; padding: 10px 15px; border: 1px solid #ddd; border-radius: 4px; background-color: #f9f9f9;">
            
            <div style="display: flex; align-items: center; margin-bottom: 10px;">
                <input type="checkbox" name="e_promocao" id="e_promocao"
          
           style="width: auto; min-width: 0; margin: 0 10px 0 0;">
                <label for="e_promocao" style="display: inline; font-weight: bold; margin: 0; padding: 0;">Este item está em promoção?</label>
            </div>
            
            <label for="data_expiracao" style="margin-top: 10px;">Data de Expiração (Obrigatório se for promoção):</label>
        
     <input type="date" name="data_expiracao" id="data_expiracao" style="padding: 0.5rem;">
            
            <div id="promo_fields" style="display: none; margin-top: 1rem; border-top: 1px dashed #ccc;
 padding-top: 1rem;">
                <label>Tipo de Promoção:</label>
                <div style="margin-bottom: 1rem;">
                    <input type="radio" name="promo_tipo" id="promo_unidade" value="unidade" checked style="width: auto;
 min-width: 0; margin-right: 5px;">
                    <label for="promo_unidade" style="font-weight: normal;
 margin-right: 15px;">Preço Reduzido (Ex: De R$5 por R$3.99)</label>
                </div>
                <div style="margin-bottom: 1rem;">
                    <input type="radio" name="promo_tipo" id="promo_quantidade" value="quantidade" style="width: auto;
 min-width: 0; margin-right: 5px;">
                    <label for="promo_quantidade" style="font-weight: normal;">Quantidade (Ex: 3 por R$10)</label>
                </div>
                <div style="margin-bottom: 1rem;">
                    <input type="radio" name="promo_tipo" id="promo_limite" value="limite" style="width: auto; min-width: 0; margin-right: 5px;">
                    <label for="promo_limite" style="font-weight: normal;">Limite (Ex: 3 ou mais, R$3.33 cada)</label>
                </div>
                <div id="div_promo_unidade_valor" style="display: none;">
                    <label for="promo_unidade_valor">Novo Preço da Unidade (R$):</label>
          
           <input type="number" step="0.01" name="promo_unidade_valor" id="promo_unidade_valor" placeholder="Ex: 3.99">
                </div>
                
                <div id="div_promo_qtd_necessaria" style="display: none;">
                    <label for="promo_qtd_necessaria">Quantidade de Itens (Mínima ou Pacote):</label>
        
             <input type="number" step="1" name="promo_qtd_necessaria" id="promo_qtd_necessaria" placeholder="Ex: 3">
                </div>
                
                <div id="div_promo_qtd_valor" style="display: none;">
                    <label for="promo_qtd_valor">Valor Total (R$) (Apenas para Pacote):</label>
                    <input type="number" step="0.01" name="promo_qtd_valor" id="promo_qtd_valor" placeholder="Ex: 10.00">
           
      </div>
                </div>
            </div>
        <button type="submit">Salvar Preço</button>
    </form>

<script>
document.addEventListener('DOMContentLoaded', () => {
    setupSelectFilter('produto_filtro', 'produto');
 setupSelectFilter('marca_filtro', 'marca');
    setupSelectFilter('supermercado_filtro', 'supermercado');
});
</script>
{% endblock %}
