{% extends 'base.html' %}

{% block content %}
    <h2>Registrar Novo Preço</h2>

    <div class="card-form">
        <form method="POST">
            <label for="produto">1. Produto:</label>
            <input type="text" id="produto_filtro" placeholder="Filtrar produto...">
            <select name="produto" id="produto" required>
                <option value="" disabled selected>-- Selecione um produto --</option>
                {% for produto in produtos %}
                    <option value="{{ produto.id }}">{{ produto.nome }}</option>
                {% endfor %}
            </select>

            <label for="marca">2. Marca (Opcional):</label>
            <input type="text" id="marca_filtro" placeholder="Filtrar marca...">
            <select name="marca" id="marca">
                <option value="">-- Sem marca --</option>
                {% for marca in marcas %}
                    <option value="{{ marca.id }}">{{ marca.nome }}</option>
                {% endfor %}
            </select>
            
            <label for="supermercado">3. Supermercado:</label>
            <input type="text" id="supermercado_filtro" placeholder="Filtrar supermercado...">
            <select name="supermercado" id="supermercado" required>
                <option value="" disabled selected>-- Selecione um supermercado --</option>
                {% for mercado in supermercados %}
                    <option value="{{ mercado.id }}">{{ mercado.nome }}</option>
                {% endfor %}
            </select>

            <label for="valor">4. Preço Base (R$):</label>
            <input type="number" step="0.01" name="valor" id="valor" placeholder="Ex: 5.99" required>

            <div style="margin: 1rem 0; padding: 10px 15px; border: 1px dashed var(--border-color); border-radius: 4px;">
                <div style="display: flex; align-items: center; margin-bottom: 10px;">
                    <input type="checkbox" name="e_promocao" id="e_promocao" style="width: auto; min-width: 0; margin: 0 10px 0 0;">
                    <label for="e_promocao" style="display: inline; margin: 0;">Este item está em promoção?</label>
                </div>
                
                <label for="data_expiracao">Data de Expiração:</label>
                <input type="date" name="data_expiracao" id="data_expiracao">
                
                <div id="promo_fields" style="display: none; margin-top: 1rem;">
                    <label>Tipo de Promoção:</label>
                    <div style="margin-bottom: 10px;">
                        <input type="radio" name="promo_tipo" value="unidade" checked style="width: auto;"> Preço Reduzido
                    </div>
                    <div style="margin-bottom: 10px;">
                        <input type="radio" name="promo_tipo" value="quantidade" style="width: auto;"> Quantidade (Ex: 3 por 10)
                    </div>
                    <div style="margin-bottom: 10px;">
                        <input type="radio" name="promo_tipo" value="limite" style="width: auto;"> Limite (Ex: 3+ por 8)
                    </div>

                    <div id="div_promo_unidade_valor"><label>Novo Preço:</label><input type="number" step="0.01" name="promo_unidade_valor"></div>
                    <div id="div_promo_qtd_necessaria" style="display:none"><label>Qtd Necessária:</label><input type="number" name="promo_qtd_necessaria"></div>
                    <div id="div_promo_qtd_valor" style="display:none"><label>Valor Total:</label><input type="number" step="0.01" name="promo_qtd_valor"></div>
                </div>
            </div>
            <button type="submit">Salvar Preço</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setupSelectFilter('produto_filtro', 'produto');
            setupSelectFilter('marca_filtro', 'marca');
            setupSelectFilter('supermercado_filtro', 'supermercado');
            
            // Lógica de Toggle (Injetada pelo base.html, só chamamos se precisar de algo extra)
             const promoCheckbox = document.getElementById('e_promocao');
             if(promoCheckbox) {
                 // Dispara o evento para garantir o estado inicial
                 const event = new Event('change');
                 promoCheckbox.dispatchEvent(event);
             }
        });
    </script>
{% endblock %}
