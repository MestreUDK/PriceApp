{% extends 'base.html' %}

{% block content %}
    <a href="{{ url_for('products.gerenciar_produtos') }}" style="text-decoration: none; color: #007bff; margin-bottom: 1rem; display: inline-block;">
        &larr; Voltar para Produtos
    </a>
    <h2>Editando Produto</h2>

    <form method="POST">
        <label for="nome">Nome do Produto:</label>
        <input type="text" name="nome" id="nome" value="{{ produto.nome }}" required>

        <button type="submit" style="background-color: #28a745;">Salvar Alterações</button>
    </form>

    <hr style="margin: 2rem 0;">

    <h2>Zona de Perigo</h2>
    <form method="POST" action="{{ url_for('products.delete_produto', produto_id=produto.id) }}" onsubmit="return confirm('ATENÇÃO: Isso excluirá este produto e TODOS os preços e sugestões registrados para ele. Tem certeza?');">
        <p>Esta ação não pode ser desfeita.</p>
        <button type="submit" style="background-color: #dc3545;">Excluir Permanentemente este Produto</button>
    </form>
    
{% endblock %}
