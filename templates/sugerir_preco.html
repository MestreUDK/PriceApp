{% extends 'base.html' %}

{% block content %}
    <h2>Sugerir Novo Preço</h2>
    <p>Ajude a manter os preços atualizados!</p>

    <div class="card-form">
        <form method="POST">
            <label for="produto">1. Produto:</label>
            <input type="text" id="produto_filtro" placeholder="Filtrar...">
            <select name="produto" id="produto" required>
                <option value="" disabled selected>-- Selecione --</option>
                {% for produto in produtos %}
                    <option value="{{ produto.id }}">{{ produto.nome }}</option>
                {% endfor %}
            </select>

            <label for="marca">2. Marca:</label>
            <input type="text" id="marca_filtro" placeholder="Filtrar...">
            <select name="marca" id="marca">
                <option value="">-- Sem marca --</option>
                {% for marca in marcas %}
                    <option value="{{ marca.id }}">{{ marca.nome }}</option>
                {% endfor %}
            </select>
            
            <label for="supermercado">3. Supermercado:</label>
            <input type="text" id="supermercado_filtro" placeholder="Filtrar...">
            <select name="supermercado" id="supermercado" required>
                <option value="" disabled selected>-- Selecione --</option>
                {% for mercado in supermercados %}
                    <option value="{{ mercado.id }}">{{ mercado.nome }}</option>
                {% endfor %}
            </select>

            <label for="valor">4. Preço (R$):</label>
            <input type="number" step="0.01" name="valor" placeholder="Ex: 5.99" required>

            <div style="margin: 1rem 0; padding: 10px; border: 1px dashed var(--border-color); border-radius: 4px;">
                <div style="display: flex; align-items: center;">
                    <input type="checkbox" name="e_promocao" id="e_promocao" style="width: auto; margin-right: 10px;">
                    <label for="e_promocao" style="display: inline; margin: 0;">É promoção?</label>
                </div>
                
                <label for="data_expiracao" style="margin-top: 10px;">Validade:</label>
                <input type="date" name="data_expiracao" id="data_expiracao">
                
                <div id="promo_fields" style="display: none; margin-top: 10px;">
                    <label>Tipo:</label>
                    <input type="radio" name="promo_tipo" value="unidade" checked style="width: auto;"> Reduzido
                    <input type="radio" name="promo_tipo" value="quantidade" style="width: auto;"> Qtd
                    <input type="radio" name="promo_tipo" value="limite" style="width: auto;"> Limite
                    
                    <div id="div_promo_unidade_valor"><label>Novo Preço:</label><input type="number" step="0.01" name="promo_unidade_valor"></div>
                    <div id="div_promo_qtd_necessaria" style="display:none"><label>Qtd:</label><input type="number" name="promo_qtd_necessaria"></div>
                    <div id="div_promo_qtd_valor" style="display:none"><label>Total:</label><input type="number" step="0.01" name="promo_qtd_valor"></div>
                </div>
            </div>

            <button type="submit">Enviar Sugestão</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setupSelectFilter('produto_filtro', 'produto');
            setupSelectFilter('marca_filtro', 'marca');
            setupSelectFilter('supermercado_filtro', 'supermercado');
        });
    </script>
{% endblock %}
