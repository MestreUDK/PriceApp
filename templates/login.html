{% extends 'base.html' %}

{% block content %}
    <style>
        /* Esconde o loader por padrão */
        .loader-container {
            display: none; /* Começa invisível */
            text-align: center;
            margin-top: 20px;
        }

        /* A animação da rodinha */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff; /* Cor Azul do seu tema */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Texto de aviso */
        .loading-text {
            color: #666;
            font-size: 0.9rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>

    <h2>Entrar no PriceApp</h2>
    <p>Bem-vindo de volta! Faça login para continuar.</p>

    <form id="loginForm" method="POST" action="{{ url_for('auth.login') }}">
        
        <label for="username">Nome de Usuário:</label>
        <input type="text" name="username" id="username" required>

        <label for="password">Senha:</label>
        <input type="password" name="password" id="password" required>

        <button type="submit" id="btnSubmit">Entrar</button>
    </form>
    
    <div id="loaderArea" class="loader-container">
        <div class="spinner"></div>
        <div class="loading-text">Acordando o servidor... (pode levar 30s)</div>
    </div>

    <hr>
    <p>Ainda não tem uma conta?</p>
    <a href="{{ url_for('auth.register') }}" style="text-decoration: none;">Crie uma agora</a>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            // 1. Pega os elementos
            var btn = document.getElementById('btnSubmit');
            var loader = document.getElementById('loaderArea');
            
            // 2. Esconde o botão (para evitar clique duplo)
            btn.style.display = 'none';
            
            // 3. Mostra o loading
            loader.style.display = 'block';
        });
    </script>
{% endblock %}
