{% extends 'base.html' %}

{% block content %}
    <a href="{{ url_for('markets.gerenciar_mercados') }}" style="text-decoration: none; color: #007bff; margin-bottom: 1rem; display: inline-block;">
        &larr; Voltar para Mercados
    </a>
    <h2>Editando Supermercado</h2>

    <form method="POST">
        <label for="nome">Nome do Supermercado:</label>
        <input type="text" name="nome" id="nome" value="{{ mercado.nome }}" required>

        <label for="endereço">Endereço:</label>
        <input type="text" name="endereço" id="endereço" value="{{ mercado.endereço or '' }}" placeholder="Endereço (Opcional)">

        <button type="submit" style="background-color: #28a745;">Salvar Alterações</button>
    </form>

    <hr style="margin: 2rem 0;">

    <h2>Zona de Perigo</h2>
    <form method="POST" action="{{ url_for('markets.delete_mercado', mercado_id=mercado.id) }}" onsubmit="return confirm('ATENÇÃO: Isso excluirá este supermercado e TODOS os preços registrados para ele. Tem certeza?');">
        <p>Esta ação não pode ser desfeita.</p>
        <button type="submit" style="background-color: #dc3545;">Excluir Permanentemente este Supermercado</button>
    </form>
    
{% endblock %}
